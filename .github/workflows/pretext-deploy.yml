#

name: Build and Deploy
on:
  # Runs on every push/merge to main (publishing the site to gh-pages), and on demand.

  # # Runs on pull requests
  # pull_request:
  #     branches: ["*"]

  # Runs on pushes to main
  push:
    branches: ["main"]

  # # Runs every day at 00:00 UTC
  # schedule:
  #     - cron: '0 0 * * *'

  # Runs on demand
  workflow_dispatch:

permissions:
  contents: write

# If several merges land close together, only deploy the newest one; the
# deploy force-pushes gh-pages, so overlapping runs must not race.
concurrency:
  group: deploy-gh-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    container: oscarlevin/pretext:full

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6

      - name: add gh-cli
        run: |
          apt-get update
          apt-get install gh jq -y

      - name: setup git config
        run: |
          git config --global --add safe.directory $(pwd)
          git config user.name "${{ github.actor }} via GitHub Actions"
          git config user.email "${{ github.actor }}@github_actions.no_reply"

      - name: install deps
        run: pip install -r requirements.txt --break-system-packages

      - name: install tex dependencies
        run: |
          set -x
          # The figures need tkz-euclide.sty and tikz-3dplot.sty. Newer
          # oscarlevin/pretext:full images may already ship them, so if
          # they are already on kpsewhich's path there is nothing to do --
          # skip tlmgr entirely and avoid the repository dance below.
          if kpsewhich tikz-3dplot.sty tkz-euclide.sty footnotehyper.sty; then
              echo "Required style files already present; skipping tlmgr install."
              exit 0
          fi

          # This image uses TinyTeX (installed under /root/.TinyTeX, with no
          # year in the path), so detect the release from the tlmgr banner
          # ("... version YYYY") and fall back to the package database.
          TLYEAR="$(tlmgr --version 2>/dev/null | grep -oE 'version 20[0-9]{2}' | grep -oE '20[0-9]{2}' | head -n1)"
          if [ -z "$TLYEAR" ]; then
              TLROOT="$(tlmgr --version 2>/dev/null | sed -n 's/^tlmgr using installation: *//p' | head -n1)"
              TLYEAR="$(sed -n 's/.*release\/\(20[0-9]\{2\}\).*/\1/p' "${TLROOT:-/root/.TinyTeX}/tlpkg/texlive.tlpdb" 2>/dev/null | head -n1)"
          fi
          echo "Detected TeX Live release: ${TLYEAR:-unknown}"

          # Historic mirror for the *frozen* release. Use ftp.math.utah.edu,
          # NOT texlive.info: texlive.info is now behind an anti-bot proxy
          # (Anubis) that blocks tlmgr/curl from CI. Utah is a stable archive.
          # tlmgr can ONLY talk to a repository from the SAME TeX Live release
          # that is installed, so the frozen tlnet-final for the detected year
          # is the only repo that can work. The live CTAN tlnet is deliberately
          # NOT used as a fallback: once CTAN rolls to the next year it triggers
          # a cross-release abort that can never succeed, which is exactly what
          # used to kill this step.
          FINAL="https://ftp.math.utah.edu/pub/tex/historic/systems/texlive/${TLYEAR}/tlnet-final"
          CHEMNITZ="https://ftp.tu-chemnitz.de/pub/tug/historic/systems/texlive/${TLYEAR}/tlnet-final"

          installed=0
          for REPO in "$FINAL" "$CHEMNITZ"; do
              [ -n "$TLYEAR" ] || break
              echo "Trying tlmgr repository: $REPO"
              tlmgr option repository "$REPO"
              tlmgr update --self || true
              if tlmgr install tkz-euclide tikz-3dplot footnotehyper; then
                  installed=1
                  break
              fi
              echo "Install from $REPO failed; trying next mirror."
          done

          # Only fail the step if the style files still cannot be found. If a
          # mirror install succeeded, or the image already had the packages,
          # kpsewhich will confirm and we proceed.
          mktexlsr

          if ! kpsewhich tikz-3dplot.sty tkz-euclide.sty footnotehyper.sty; then
              echo "::error::Could not locate tkz-euclide.sty / tikz-3dplot.sty / footnotehyper.sty after tlmgr install (installed=$installed). Frozen tlnet-final for TeX Live ${TLYEAR:-unknown} may be unavailable, or the container's TeX Live release has drifted."
              exit 1
          fi

      - name: install local ptx files
        run: pretext --version

      # Build the PDFs first and put them in assets/, so the HTML builds below
      # copy them into <track>/teachers/external/ where the books link to them.
      - name: build print versions
        run: |
          pretext build core-print
          pretext build essential-print
          cp output/core-print/main.pdf assets/CBC-Grade-12-Core-Maths.pdf
          cp output/essential-print/main.pdf assets/CBC-Grade-12-Essential-Maths.pdf

      - name: build deploy targets
        run: pretext build --deploys

      - name: Copy custom stackapicalls.js
        run: |
          for t in core essential; do
            for v in web student; do
              cp assets/pretext/js/pretext-stack/stackapicalls.js output/$t-$v/_static/pretext/js/pretext-stack/stackapicalls.js
            done
          done

      # Serve the Core teachers' book at the site root as well. PreTeXt copies
      # everything in site/ to the root of the staged deployment.
      - name: Copy Core teachers' book into site root
        run: cp -r output/core-web/. site/

      # Deploy layout (see project.ptx):
      #   /                    -> Core teachers' book (same as core/teachers/)
      #   /core/teachers/      /core/students/      /core/plans/
      #   /essential/teachers/ /essential/students/ /essential/plans/
      - name: run deploy
        run: pretext deploy --no-push

      - name: push gh-pages branch
        run: git push origin gh-pages --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        