<div class="para" id="interactive-velocity-triangle-2-1-1-1-1">Drag the point <em class="alert">B</em> (the tip of the course arrow from O) and the point <em class="alert">C</em> (the tip of the current arrow from B). The readout gives the course, the current, the track, the ground speed and the drift angle. One grid square is <span class="process-math">\(0.1\)</span> units of speed.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#interactive-velocity-triangle-2-1-1-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>

</li>
<li id="interactive-velocity-triangle-2-1-1-2">
<div class="para" id="interactive-velocity-triangle-2-1-1-2-1">Check the activity: put B at <span class="process-math">\(0.5\)</span> north of O (course <span class="process-math">\(000^\circ\)</span>) and C at <span class="process-math">\(0.4\)</span> east of B. The readout gives a ground speed of <span class="process-math">\(0.6\)</span> (more exactly <span class="process-math">\(0.64\)</span>) and a drift of <span class="process-math">\(38.7^\circ\text{.}\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#interactive-velocity-triangle-2-1-1-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>

<div class="autopermalink" aria-hidden="true" data-description="Item"><a tabindex="-1" href="#interactive-velocity-triangle-2-1-1-2" title="Copy heading and permalink for Item" aria-label="Copy heading and permalink for Item">🔗</a></div>
</li>
<li id="interactive-velocity-triangle-2-1-1-3">
<div class="para" id="interactive-velocity-triangle-2-1-1-3-1">Point the course where you want to go, then tick <em class="alert">hold track</em>. That direction becomes the required track (dashed line); the current and the boat’s speed are fixed, and B now moves on a circle. Turn B until C lies on the dashed line (the readout says “on track”), and read how far the course is from the track: that is the angle you must steer into the current.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#interactive-velocity-triangle-2-1-1-3-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
