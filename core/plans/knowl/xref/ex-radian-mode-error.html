<div class="para">Juma’s table for <span class="process-math">\(y = \sin x\)</span> gives <span class="process-math">\(-0.99\)</span> at <span class="process-math">\(x = 30^\circ\text{.}\)</span> What went wrong?<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#ex-radian-mode-error-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>

<div class="answer solution-like knowl__content">
