<div class="para">A curve has <span class="process-math">\(\dfrac{dy}{dx} = 4x + 3\)</span> and passes through <span class="process-math">\((1, 6)\text{.}\)</span> Find its equation.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#ex-curve-through-1-6-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>

<div class="answer solution-like knowl__content">
<div class="para">
<span class="process-math">\(y = 2x^2 + 3x + 1\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#ex-curve-through-1-6-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
