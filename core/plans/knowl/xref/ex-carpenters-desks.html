</h2>
<div class="para">
<span class="process-math">\(6\)</span> carpenters make <span class="process-math">\(90\)</span> school desks in <span class="process-math">\(5\)</span> days. How many desks do <span class="process-math">\(9\)</span> carpenters make in <span class="process-math">\(8\)</span> days?<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#ex-carpenters-desks-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
<div class="solutions">
<details class="answer solution-like born-hidden-knowl"><summary class="knowl__link"><span class="type">Answer</span><span class="period heading-divison-mark heading-divison-mark__period">.</span></summary>
<div class="answer solution-like knowl__content">
<div class="para">
<span class="process-math">\(216\)</span> desks<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#ex-carpenters-desks-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
<div class="autopermalink" aria-hidden="true" data-description="Answer 3.2.2.2.1"><a tabindex="-1" href="#ex-carpenters-desks-2" title="Copy heading and permalink for Answer 3.2.2.2.1" aria-label="Copy heading and permalink for Answer 3.2.2.2.1">🔗</a></div>
</div></details>
<details class="solution solution-like born-hidden-knowl"><summary class="knowl__link"><span class="type">Solution</span><span class="period heading-divison-mark heading-divison-mark__period">.</span></summary>
<div class="solution solution-like knowl__content">
