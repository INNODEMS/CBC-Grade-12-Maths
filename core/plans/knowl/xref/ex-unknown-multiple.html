</h2>
<div class="para">The vector <span class="process-math">\(\begin{pmatrix} 2k \\ k \\ -2k \end{pmatrix}\)</span> has magnitude <span class="process-math">\(12\text{.}\)</span> Find the two values of <span class="process-math">\(k\text{.}\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#ex-unknown-multiple-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>

<div class="answer solution-like knowl__content">
<div class="para">
<span class="process-math">\(k = 4\)</span> or <span class="process-math">\(k = -4\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#ex-unknown-multiple-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
